<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inforock</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
         <nav>
            <div class="nav-content">
                <div class="hamburger">
                    <i data-feather="menu"></i>
                </div>
                <ul class="nav-links">
                    <li><a href="noticias.html">Noticias</a></li>
                    <li><a href="escribeme.html">Escribeme</a></li>
                </ul>
                <a class="logo" href="home.html"><img src="" alt="logo inforock">INFOROCK</a>
                <div class="buscador">
                    <input type="search" placeholder="Buscar por nombre, ciudad, artista, género">
                    <i data-feather="search"></i>
                </div>
                <div class="nav-actions">
                    <div class="registro">
                       <button>Registrate</button>
                       <form action="" id="registro-pop-up">
                        <label for="nombre">Nombre</label>
                        <input type="text" required>
                        <label for="apellido">Apellido</label>
                        <input type="text" required>
                        <label for="correo">Correo</label>
                        <input type="text" required>
                        <button type="submit">Enviar</button>
                       </form>
                    </div>
                    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo oscuro">
                            <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☾</span>
                            <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀</span>
                    </button>
                </div>
            </div>
        </nav>

        <section class="entradas">
            <h1>ADQUIERE AQUI TUS ENTRADAS</h1>
            <form action="">
                <div class="cantidad">
                    <p>Selecciona la cantidad</p>
                    <div class="contador">
                        <button id="resta" class="btn-numero">-</button>
                        <span class="numero">0</span>
                        <button id="suma" class="btn-numero">+</button>
                    </div>
                </div>
               <div class="cuestionario-entradas">
                    <label for="tipo-ticket">
                        Selecciona el tipo
                    </label>
                    <select name="" id="">
                        <option value="" selected disabled></option>
                        <option value="E1">VIP (370€)</option>
                        <option value="E2">Butacas delanteras(250€)</option>
                        <option value="E2">Butacas intermedias(130€)</option>
                        <option value="E2">Butacas traseras (80€)</option>
                    </select>
               </div>
               <p>Precio total: <span id="coste-total"></span></p>
               <button class="btn-rojo">Comprar</button>
               <p class="advertencia">Advertencia: entradas no asequibles para menores de 18</p>
            </form>
        </section>

        <footer>
            <div class="footer-content">
                <div class="menu">
                    <h3>MENU</h3>
                    <a href="noticias.html">Noticias</a>
                    <a href="escribeme.html">Escribeme</a>
                </div>
                <div class="contacto">
                    <h3>CONTACTO</h3>
                    <span>
                        <i data-feather="mail"></i>
                        Mail:contacto@inforock.com
                    </span>
                     <span>
                        <i data-feather="instagram"></i>
                        Instagram: @inforock.es
                    </span>
                </div>
            </div>
        </footer>

        <script src="https://unpkg.com/feather-icons"></script>
        <script>
           feather.replace();
        </script>
        <script src="js/script.js"></script>
   </body>
</html>
