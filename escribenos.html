<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inforock</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
         <nav>
            <div class="nav-content">
                <div class="hamburger">
                    <i data-feather="menu"></i>
                </div>
                <ul class="nav-links">
                    <li><a href="noticias.html">Noticias</a></li>
                </ul>
                <a class="logo" href="home.html"><img src="imagenes/Logo inforock.png" alt="logo inforock">INFOROCK</a>
                <div class="buscador">
                    <input type="search" placeholder="Buscar por nombre, ciudad, artista, género">
                    <i data-feather="search"></i>
                </div>
                <div class="nav-actions">
                    <div class="registro">
                       <button>Registrate</button>
                       <form action="" id="registro-pop-up">
                        <label for="nombre">Nombre</label>
                        <input type="text" required>
                        <label for="apellido">Apellido</label>
                        <input type="text" required>
                        <label for="correo">Correo</label>
                        <input type="text" required>
                        <button type="submit">Enviar</button>
                       </form>
                    </div>
                    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo oscuro">
                            <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☾</span>
                            <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀</span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="novedades">
            <button type="button"><i data-feather="x"></i></button>
            <span class="btn-rojo">Ultimas novedades</span>
            <i data-feather="arrow-right"></i>
            <a href="noticias.html">Neil Young publica su quincuagesimo album en solitario, titulado "Second Song"</a>
        </div>


        <section class="escribir">
         <h1>Contacta con nosotros</h1>
         <form action="" id="contactame">
            <label for="n-a">Nombre y Apellidos</label>
            <input id="nya" type="text" required>
            <label for="correo-electronico">Correo electrónico</label>
            <input id="m" type="email" required>
            <label for="mensaje">Cuentame</label>
            <textarea name="mensaje" id="men" required></textarea>
            <div class="botones-formulario">
                <button class="btn-negro" type="submit">
                    Enviar
                </button>
                <button class="btn-rojo" type="reset">
                    Borrar
                </button>
            </div>
         </form>
        </section>

        <footer>
            <div class="footer-content">
                <div class="menu">
                    <h3>MENU</h3>
                    <a href="noticias.html">Noticias</a>
                </div>
                <div class="contacto">
                    <h3>CONTACTO</h3>
                    <span>
                        <i data-feather="mail"></i>
                        Mail:contacto@inforock.com
                    </span>
                     <span>
                        <i data-feather="instagram"></i>
                        Instagram: @inforock.es
                    </span>
                </div>
            </div>
        </footer>

        <script src="https://unpkg.com/feather-icons"></script>
        <script>
           feather.replace();
        </script>
        <script src="js/script.js"></script>
   </body>
</html>
